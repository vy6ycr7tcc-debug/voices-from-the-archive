<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B1F">
<meta name="description" content="A browsable archive of interpretive narrations drawn from the L/L Research channeling archive.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voices">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Voices from the Archive">
<meta property="og:title" content="Voices from the Archive">
<meta property="og:description" content="An interpretive journey through the L/L Research channeling archive — nearly two thousand sessions of strange and beautiful writing, read aloud in the quiet.">
<meta property="og:image" content="https://vy6ycr7tcc-debug.github.io/voices-from-the-archive/og-share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://vy6ycr7tcc-debug.github.io/voices-from-the-archive/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Voices from the Archive">
<meta name="twitter:description" content="An interpretive journey through the L/L Research channeling archive — nearly two thousand sessions of strange and beautiful writing, read aloud in the quiet.">
<meta name="twitter:image" content="https://vy6ycr7tcc-debug.github.io/voices-from-the-archive/og-share.jpg">
<title>Voices from the Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<div class="ambient" aria-hidden="true">
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <canvas id="ambientCanvas"></canvas>
</div>

<header class="site-header">
  <div class="hero" aria-hidden="true">
    <div class="hero-glow-back"></div>
    <div class="hero-ring hero-ring-1"></div>
    <div class="hero-ring hero-ring-2"></div>
    <div class="hero-moon"></div>
  </div>
  <div class="wrap header-content">
    <div class="title-lockup">
      <div class="title-eyebrow">The Complete Collection</div>
      <h1 class="site-title">Voices from the Archive</h1>
      <p class="site-sub">Interpretive narrations drawn from the L/L Research channeling archive</p>
    </div>
  </div>
</header>

<div class="sticky-top">
  <div class="wrap">
    <nav class="tabs" aria-label="Sections">
      <button class="tab active" data-tab="episodes" type="button">Episodes</button>
      <button class="tab" data-tab="bookmarks" type="button">Bookmarks</button>
    </nav>
    <div class="search-row">
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="q" type="search" placeholder="Search titles, transcripts, themes…" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search episodes">
        <button id="qClear" class="search-clear" type="button" aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7.2 7.1 Q12 11.6 16.8 16.9"/><path d="M16.8 7.1 Q12 11.6 7.2 16.9"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="wrap filter-row">
  <select id="fTheme" aria-label="Filter by topic"><option value="">All topics</option></select>
  <select id="fEntity" aria-label="Filter by entity"><option value="">All entities</option></select>
  <select id="fSeason" aria-label="Filter by season"><option value="">All seasons</option></select>
  <button id="refresh" class="refresh-btn" type="button" title="Reload the episode catalog" aria-label="Refresh episode catalog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/></svg>
    <span>Refresh</span>
  </button>
</div>

<div class="wrap result-count" id="count"></div>

<main class="wrap list" id="list"></main>

<div class="wrap more-wrap" id="moreWrap" hidden>
  <button id="more" type="button">Show more</button>
</div>

<div class="wrap empty" id="empty" hidden></div>

<footer class="site-footer">
  <div class="wrap">
    Independent, AI-voiced, interpretive work · not affiliated with or endorsed by L/L Research
  </div>
</footer>

<!-- Mini player -->
<div class="mini" id="mini" hidden>
  <div class="mini-inner">
    <div class="mini-top">
      <button class="mini-play" id="miniPlay" type="button" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 6.7c0-.8.9-1.3 1.6-.9l8.6 5.3c.7.4.7 1.4 0 1.8l-8.6 5.3c-.7.4-1.6-.1-1.6-.9Z" fill="currentColor" stroke="none"/></svg>
      </button>
      <div class="mini-body">
        <div class="mini-title-row">
          <span class="mini-title" id="miniTitle" role="button" tabindex="0"></span>
          <span class="mini-time" id="miniTime">0:00</span>
        </div>
      </div>
      <button class="icon-btn mini-close" id="miniClose" type="button" aria-label="Close player">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7.2 7.1 Q12 11.6 16.8 16.9"/><path d="M16.8 7.1 Q12 11.6 7.2 16.9"/></svg>
      </button>
    </div>
    <div class="mini-bottom">
      <button class="icon-btn skip" id="miniBack" type="button" aria-label="Skip back 15 seconds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 6.7c0-.8-.9-1.3-1.6-.9l-8.6 5.3c-.7.4-.7 1.4 0 1.8l8.6 5.3c.7.4 1.6-.1 1.6-.9Z" fill="currentColor" stroke="none"/><path d="M6.4 6.2v11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="mini-scrub" id="miniScrub" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="mini-track"><div class="mini-fill" id="miniFill"></div><div class="mini-thumb" id="miniThumb"></div></div>
      </div>
      <button class="icon-btn skip" id="miniFwd" type="button" aria-label="Skip forward 15 seconds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.4 6.7c0-.8.9-1.3 1.6-.9l8.6 5.3c.7.4.7 1.4 0 1.8l-8.6 5.3c-.7.4-1.6-.1-1.6-.9Z" fill="currentColor" stroke="none"/><path d="M17.6 6.2v11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Detail reading sheet -->
<div class="detail" id="detail" hidden>
  <div class="detail-bar">
    <button class="back-btn" id="detailBack" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Back
    </button>
    <div class="detail-bar-actions">
      <button class="icon-btn bookmark" id="detailBookmark" data-action="bookmark" type="button" aria-label="Bookmark episode" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 5.6c0-.9.7-1.6 1.6-1.6h6.4c.9 0 1.6.7 1.6 1.6v14.6c0 .6-.7 1-1.2.6L12 17.6l-3.6 3.2c-.5.4-1.2 0-1.2-.6V5.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="detailShare" data-action="share" type="button" aria-label="Share episode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.4v10.4"/><path d="M8.2 7 12 3.2 15.8 7"/><path d="M6.4 11.8v6.8c0 1.1.9 2 2 2h7.2c1.1 0 2-.9 2-2v-6.8"/></svg>
      </button>
    </div>
  </div>

  <div class="detail-scroll" id="detailScroll">
    <article class="sheet">
      <div class="ep-kicker" id="dKicker"></div>
      <h1 class="sheet-title" id="dTitle"></h1>
      <div class="ep-meta" id="dMeta"></div>

      <div class="player">
        <div class="player-controls">
          <button class="ctrl-btn" id="btnSkipBack" type="button" aria-label="Skip back 15 seconds">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 6.7c0-.8-.9-1.3-1.6-.9l-8.6 5.3c-.7.4-.7 1.4 0 1.8l8.6 5.3c.7.4 1.6-.1 1.6-.9Z" fill="currentColor" stroke="none"/><path d="M6.4 6.2v11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button class="play-btn" id="btnPlay" type="button" aria-label="Play">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 6.7c0-.8.9-1.3 1.6-.9l8.6 5.3c.7.4.7 1.4 0 1.8l-8.6 5.3c-.7.4-1.6-.1-1.6-.9Z" fill="currentColor" stroke="none"/></svg>
          </button>
          <button class="ctrl-btn" id="btnSkipFwd" type="button" aria-label="Skip forward 15 seconds">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.4 6.7c0-.8.9-1.3 1.6-.9l8.6 5.3c.7.4.7 1.4 0 1.8l-8.6 5.3c-.7.4-1.6-.1-1.6-.9Z" fill="currentColor" stroke="none"/><path d="M17.6 6.2v11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="scrub" id="scrub" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="scrub-track">
            <div class="scrub-fill" id="scrubFill"></div>
            <div class="scrub-thumb" id="scrubThumb"></div>
          </div>
        </div>
        <div class="player-time" id="timeReadout"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>

      <div class="transcript" id="dTranscript"></div>
      <div class="sources" id="dSources"></div>
      <div class="related" id="dRelated"></div>
    </article>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
<script src="ambient.js"></script>
</body>
</html>
